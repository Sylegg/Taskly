spring:
  datasource:
    url: jdbc:h2:mem:taskly;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      repositories:
        enabled: false
  cache:
    type: simple
management:
  health:
    redis:
      enabled: false
app:
  environment: test
  cors:
    allowed-origins: http://localhost:3000
