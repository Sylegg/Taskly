logging:
  level:
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN

spring:
  application:
    name: taskly-backend
  profiles:
    default: development
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/taskly}
    username: ${POSTGRES_USER:taskly}
    password: ${POSTGRES_PASSWORD:taskly_dev_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_BYTES:100MB}
      max-request-size: ${MAX_REQUEST_BYTES:102MB}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
    redis:
      time-to-live: ${CATALOGUE_CACHE_TTL:10m}
      cache-null-values: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS_ENABLE:false}
      mail.smtp.starttls.required: ${MAIL_STARTTLS_REQUIRED:false}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    redis:
      enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

info:
  app:
    name: TaskLy API
    version: ${APP_VERSION:development}

app:
  environment: ${APP_ENV:development}
  recruitment:
    demo-seed: ${RECRUITMENT_DEMO_SEED:false}
  cors:
    allowed-origins: ${FRONTEND_ORIGINS:http://localhost:3000}
  security:
    production-profile: production
  auth:
    access-secret: ${JWT_ACCESS_SECRET:taskly-development-access-secret-change-before-production}
    refresh-pepper: ${REFRESH_TOKEN_PEPPER:taskly-development-refresh-pepper-change-before-production}
    access-ttl-minutes: ${ACCESS_TOKEN_TTL_MINUTES:15}
    refresh-ttl-days: ${REFRESH_TOKEN_TTL_DAYS:14}
    otp-ttl-minutes: ${OTP_TTL_MINUTES:5}
    otp-resend-seconds: ${OTP_RESEND_SECONDS:60}
    otp-max-attempts: ${OTP_MAX_ATTEMPTS:5}
    login-max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    login-cooldown-seconds: ${LOGIN_COOLDOWN_SECONDS:900}
    secure-cookies: ${SECURE_COOKIES:false}
  mail:
    from: ${MAIL_FROM:no-reply@taskly.local}
  storage:
    local-directory: ${TASKLY_LOCAL_STORAGE_DIRECTORY:}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://127.0.0.1:8080}
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:taskly_dev}
    secret-key: ${MINIO_ROOT_PASSWORD:taskly_dev_password}
    private-bucket: ${MINIO_BUCKET_PRIVATE:taskly-private}
    max-image-bytes: ${MAX_IMAGE_BYTES:10485760}
    signed-url-seconds: ${SIGNED_URL_SECONDS:300}
