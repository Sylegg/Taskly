function toast(msg,bad=false){const el=$('#toast');el.textContent=msg;el.style.background=bad?'#883543':'#183e34';el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,3500)}
function allowed(cap){return db.actor==='SUPER_ADMIN'||(CAPS[db.actor]||[]).includes(cap)}
function guard(cap){if(!allowed(cap)){toast('Vai trò '+db.actor+' chỉ có quyền xem mục này.','error');return false}return true}
function find(type,id){return (db[type]||[]).find(x=>String(x.id)===String(id))}
function customer(id){return find('customers',id)?.name||id||'—'}
function partner(id){return find('partners',id)?.name||'Chưa phân công'}
function service(id){return find('services',id)?.name||id||'—'}
function pill(status){let s=String(status??'—'), label=STATUS[s]||{ACTIVE:'Hoạt động',RESTRICTED:'Hạn chế',SUSPENDED:'Tạm khóa',APPROVED:'Đã duyệt',REJECTED:'Từ chối',PENDING:'Chờ duyệt',UNDER_REVIEW:'Đang kiểm tra',OPEN:'Mới',IN_PROGRESS:'Đang xử lý',REVIEW:'Đang xét',RESOLVED:'Đã giải quyết',SENT:'Đã gửi',DRAFT:'Nháp',HELD:'Đang giữ (demo)',RELEASED:'Đã giải ngân',REFUNDED:'Hoàn tiền',FAILED:'Thất bại',COMPLETED:'Hoàn tất',CANCELLED:'Đã hủy',PAUSED:'Tạm dừng',IN_REVIEW:'Đang kiểm tra',HIDDEN:'Đã ẩn'}[s]||s;let color=/^(PAID|ACTIVE|APPROVED|RESOLVED|RELEASED|COMPLETED|SENT)$/.test(s)?'green':/^(REJECTED|SUSPENDED|FAILED|CANCELLED|REFUNDED|HIDDEN)$/.test(s)?'red':/^(PENDING|MATCHING|UNDER_REVIEW|IN_PROGRESS|REVIEW|HELD|OPEN|DISPUTED|IN_REVIEW)$/.test(s)?'orange':/^(ACCEPTED|TASKER_ON_THE_WAY|ARRIVED)$/.test(s)?'blue':'gray';return `<span class="badge ${color}">${esc(label)}</span>`}

function renderField(def,existing){const [key,label,type,required]=def;const val=existing?.[key]??'';const attrs=`name="${key}" ${required==='required'?'required':''}`;let inp;if(type==='textarea')inp=`<textarea class="field" ${attrs}>${esc(val)}</textarea>`;else if(type==='customers'||type==='partners'||type==='services'||type==='tasks'){const opts=(db[type]||[]).map(x=>({id:x.id,label:x.name||x.id}));inp=`<select class="field" ${attrs}><option value="">-- Chọn --</option>${opts.map(x=>`<option value="${esc(x.id)}" ${String(val)===String(x.id)?'selected':''}>${esc(x.label)}</option>`).join('')}</select>`}else if(type.startsWith('select:')){inp=`<select class="field" ${attrs}>${type.slice(7).split('|').map(s=>`<option value="${esc(s)}" ${String(val)===s?'selected':''}>${esc(s)}</option>`).join('')}</select>`}else inp=`<input class="field" type="${type}" ${attrs} value="${esc(val)}" ${type==='number'?'min="0"':''}>`;return `<div class="formgroup ${type==='textarea'?'full':''}"><label>${esc(label)}</label>${inp}</div>`}

function saveForm(form){const type=form.dataset.type,id=form.dataset.id;let cap=type==='categories'?'services':type;if(!guard(cap))return;const data=Object.fromEntries(new FormData(form).entries());const nums={services:['price','duration'],pricing:['base','feePercent','urgentPercent'],tasks:['total'],refunds:['amount'],vouchers:['discount','min','limit'],banners:['order']};for(const k of nums[type]||[]) data[k]=Number(data[k]||0);
 if(type==='refunds'){const task=find('tasks',data.taskId);if(!task){toast('Chọn Task hợp lệ',true);return}if(data.amount<=0||data.amount>task.total){toast('Số tiền hoàn phải lớn hơn 0 và không vượt giá trị Task',true);return}}
 if(type==='tasks'&&data.total<=0){toast('Giá Task không hợp lệ',true);return}
 if(type==='vouchers'&&db.vouchers.some(v=>v.code===data.code&&v.id!==id)){toast('Mã voucher đã tồn tại',true);return}
 if(['customers','partners','staff'].includes(type)&&data.email&&db[type].some(v=>v.email?.toLowerCase()===data.email.toLowerCase()&&v.id!==id)){toast('Email đã tồn tại trong nhóm tài khoản này',true);return}
 if(['services','pricing'].includes(type)&&Number(data.price??data.base)<=0){toast('Giá dịch vụ phải lớn hơn 0',true);return}
 let obj=id?find(type,id):null;let isNew=!obj;
 if(obj){Object.assign(obj,data)}else{obj={...data,id:uid(({customers:'C',partners:'P',services:'S',categories:'CAT',pricing:'PR',tasks:'TL',refunds:'RF',vouchers:'V',banners:'B',campaigns:'N',staff:'A',tickets:'S'}[type]||'ID')),created:today()};if(type==='tasks'){obj.status='POSTED';obj.payment='PENDING';obj.history=[{status:'POSTED',actor:db.actor,at:dt()}]}if(type==='partners'){obj.kyc='PENDING';obj.skills=[];obj.rating='4.9'}if(type==='services')obj.active=true;if(type==='categories'||type==='pricing'||type==='vouchers'||type==='banners')obj.active=true;if(type==='vouchers')obj.uses=0;if(type==='campaigns'){obj.status='DRAFT';obj.sent=0}if(type==='tickets'){obj.status='OPEN';obj.agent='Chưa phân công';obj.reply=''}if(type==='refunds')obj.status='PENDING';if(type==='customers'){obj.status=obj.status||'ACTIVE';obj.bookings=0;obj.points=0}if(type==='staff')obj.status='ACTIVE';db[type].unshift(obj);if(type==='partners')db.kycs.unshift({id:uid('K'),partnerId:obj.id,status:'PENDING',submitted:today(),type:'CCCD + Selfie',note:''});if(type==='tasks')db.payments.unshift({id:uid('PM'),taskId:obj.id,customerId:obj.customerId,amount:obj.total,status:'PENDING',method:'Sandbox demo',created:today(),providerRef:'SIM-'+Date.now()});}
 log(isNew?'CREATE':'UPDATE',type,obj.id,JSON.stringify(data).slice(0,180));$('#layer').innerHTML='';toast(isNew?'Đã tạo bản ghi demo':'Đã lưu thay đổi');renderContent();}
function updateTask(t,next,reason='Admin demo'){const prev=t.status;if(prev===next)return; t.status=next;t.history??=[];t.history.push({status:next,actor:db.actor,at:dt(),reason});log('TASK_STATUS','tasks',t.id,prev+' → '+next+'; '+reason)}
function recordLedger(kind,taskId,amount,from,to,status){db.ledger.unshift({id:uid('LG'),kind,taskId,amount,from,to,at:dt(),status});save()}
function release(t,reason){const p=db.payments.find(x=>x.taskId===t.id);if(!p||!['HELD','RELEASED'].includes(p.status)){toast('Không thể giải ngân khi thanh toán không ở trạng thái HELD',true);return false}if(p.status==='RELEASED')return true;p.status='RELEASED';t.payment='RELEASED';updateTask(t,'PAID',reason);recordLedger('RELEASE',t.id,p.amount,'Escrow demo','Partner',p.status);return true}
function ensureTaskForRefund(t){if(!t){toast('Không tìm thấy Task',true);return false}const p=db.payments.find(x=>x.taskId===t.id);if(!p||!['HELD','RELEASED','PARTIALLY_REFUNDED'].includes(p.status)){toast('Giao dịch hiện không đủ điều kiện hoàn trong demo',true);return false}return true}
function modalPrompt(title,fields,confirmText,onSubmit){window._modalSubmit=onSubmit;$('#layer').innerHTML=`<div class="overlay modal-overlay"><div class="modal" role="dialog"><div class="drawer-head"><h2>${esc(title)}</h2><button data-action="close" class="btn ghost">✕</button></div><div class="alert warn">Thao tác sẽ cập nhật dữ liệu bản demo và ghi Audit Log.</div><form id="quickForm" class="formgrid">${fields.map(([key,label,kind,value,options])=>`<div class="formgroup full"><label>${esc(label)}</label>${kind==='select'?`<select class="field" name="${key}" required>${options.map(([id,l])=>`<option value="${esc(id)}" ${id===value?'selected':''}>${esc(l)}</option>`).join('')}</select>`:kind==='textarea'?`<textarea class="field" name="${key}" required>${esc(value||'')}</textarea>`:`<input class="field" name="${key}" type="${kind||'text'}" value="${esc(value||'')}" ${kind==='number'?'min="0"':''} required>`}</div>`).join('')}<div class="actionrow full" style="justify-content:flex-end">${btn('Đóng','close','','ghost')}<button type="submit" class="btn primary">${esc(confirmText)}</button></div></form></div></div>`}
function mutate(action,type,id){const obj=find(type,id),cap=type==='kycs'?'kyc':type==='reports'?'safety':type==='categories'?'services':type;if(!guard(cap))return;let rerender=true;
 switch(action){
 case 'toggleAccount':if(!obj)return;{let was=obj.status==='ACTIVE';obj.status=was?(type==='customers'?'RESTRICTED':'SUSPENDED'):'ACTIVE';log('ACCOUNT_STATUS',type,id,obj.status)}break;
 case 'toggle':if(!obj)return;obj.active=!obj.active;log('TOGGLE',type,id,String(obj.active));break;

 case 'approveKyc':if(!obj||obj.status==='APPROVED')return;obj.status='APPROVED';obj.note='Duyệt bởi '+db.actor+' • '+dt();{const p=find('partners',obj.partnerId);if(p)p.kyc='APPROVED'}log('KYC_APPROVE',type,id,obj.partnerId);break;
 case 'rejectKyc':if(!obj)return;modalPrompt('Từ chối / yêu cầu bổ sung KYC',[['reason','Lý do từ chối','textarea','Ảnh giấy tờ chưa rõ']], 'Xác nhận từ chối',v=>{obj.status='REJECTED';obj.note=v.reason;let p=find('partners',obj.partnerId);if(p)p.kyc='REJECTED';log('KYC_REJECT','kycs',id,v.reason);toast('Đã từ chối và ghi chú');renderContent()});return;
 case 'reopenKyc':if(!obj)return;obj.status='PENDING';let p=find('partners',obj.partnerId);if(p)p.kyc='PENDING';log('KYC_REOPEN',type,id);break;
 case 'taskNext':if(!obj)return;{const i=FLOW.indexOf(obj.status);if(i===-1||i===FLOW.length-1){toast('Trạng thái này không chuyển tiếp trực tiếp',true);return}if(FLOW[i+1]==='ACCEPTED'){toast('Phải gán Partner trước khi nhận việc',true);return}if(!obj.partnerId&&i>=2){toast('Task chưa có Partner',true);return}if(FLOW[i+1]==='PAID'){if(!release(obj,'Customer/Admin confirm demo'))return}else updateTask(obj,FLOW[i+1],'Admin demo advance')}break;
 case 'assignPartner':if(!obj)return;if(!['POSTED','MATCHING','ACCEPTED','TASKER_ON_THE_WAY'].includes(obj.status)){toast('Không thể đổi Partner sau khi công việc đã hoàn thành hoặc đang tranh chấp',true);return}{const eligible=db.partners.filter(p=>p.kyc==='APPROVED'&&p.status==='ACTIVE'&&p.skills.includes(obj.serviceId));if(!eligible.length){toast('Không có Partner đạt KYC và kỹ năng yêu cầu',true);return}modalPrompt('Gán Partner đủ điều kiện',[['partnerId','Chọn Partner','select',eligible[0].id,eligible.map(p=>[p.id,p.name+' · '+p.area])],['reason','Ghi chú điều phối','text','Admin phân công']], 'Gán & xác nhận',v=>{const p=find('partners',v.partnerId);if(!p){toast('Partner không tồn tại',true);return}const conflict=db.tasks.find(x=>x.id!==obj.id&&x.partnerId===p.id&&x.date===obj.date&&x.time===obj.time&&['ACCEPTED','TASKER_ON_THE_WAY','ARRIVED','IN_PROGRESS'].includes(x.status));if(conflict){toast('Partner đã có việc trùng ngày/giờ trong demo',true);return}obj.partnerId=p.id;updateTask(obj,'ACCEPTED',v.reason);log('MANUAL_ASSIGN','tasks',obj.id,p.id);renderContent()});return;}
 case 'rematchTask':if(!obj)return;if(!['MATCHING','ACCEPTED','TASKER_ON_THE_WAY','ARRIVED','POSTED','CANCELLED'].includes(obj.status)){toast('Không cho phép rematch trạng thái hiện tại',true);return}obj.partnerId='';updateTask(obj,'MATCHING','Replacement / rematching demo');break;
 case 'cancelTask':if(!obj)return;if(['PAID','REFUNDED','CANCELLED'].includes(obj.status)){toast('Không thể hủy Task ở trạng thái hiện tại',true);return}if(!confirm('Hủy Task '+obj.id+'? Thanh toán đang giữ sẽ tạo yêu cầu hoàn tiền, không tự hoàn ngay.'))return;updateTask(obj,'CANCELLED','Admin cancel demo');{const p=db.payments.find(p=>p.taskId===obj.id);if(p?.status==='HELD'&&!db.refunds.some(r=>r.taskId===obj.id&&r.status==='PENDING'))db.refunds.unshift({id:uid('RF'),taskId:obj.id,paymentId:p.id,amount:p.amount,reason:'Hủy công việc',status:'PENDING',created:today()});}break;
 case 'openPayment':{const p=db.payments.find(p=>p.taskId===obj.id);if(!p){toast('Không có giao dịch',true);return}detail('payments',p.id);return}
 case 'createDispute':if(!obj)return;db.disputes.unshift({id:uid('D'),taskId:obj.id,from:'Admin demo',reason:'Khởi tạo kiểm tra nghiệp vụ',status:'OPEN',amount:obj.total,evidence:'Chưa có',created:today()});updateTask(obj,'DISPUTED','Admin open case');log('DISPUTE_CREATE','disputes',obj.id);break;
 case 'reconcilePayment':if(!obj)return;if(obj.status==='PENDING'||obj.status==='FAILED'){obj.status='HELD';let t=find('tasks',obj.taskId);if(t){t.payment='HELD';if(t.status==='POSTED')updateTask(t,'MATCHING','Demo webhook confirmed')}}else{toast('Trạng thái này không thể reconcile',true);return}log('PAYMENT_RECONCILE','payments',obj.id);break;
 case 'failPayment':if(!obj)return;if(obj.status==='RELEASED'||obj.status==='REFUNDED'){toast('Giao dịch đã tất toán, không thể giả lập thất bại',true);return}obj.status='FAILED';let t=find('tasks',obj.taskId);if(t)t.payment='FAILED';log('PAYMENT_FAILURE','payments',obj.id);break;
 case 'requestRefund':{const t=find('tasks',obj.taskId);if(!ensureTaskForRefund(t))return;modalPrompt('Tạo yêu cầu hoàn tiền',[['amount','Số tiền hoàn','number',String(obj.amount)],['reason','Lý do','textarea','Customer yêu cầu hoàn tiền']], 'Gửi yêu cầu',v=>{const amount=Number(v.amount);if(amount<=0||amount>obj.amount){toast('Số tiền hoàn không hợp lệ',true);return}db.refunds.unshift({id:uid('RF'),paymentId:obj.id,taskId:obj.taskId,amount,reason:v.reason,status:'PENDING',created:today()});log('REFUND_REQUEST','refunds',obj.id,money(amount));renderContent()});return}
 case 'approveRefund':if(!obj||obj.status!=='PENDING'){toast('Yêu cầu không ở trạng thái chờ',true);return}if(obj.amount>=db.settings.refundThreshold && db.actor!=='SUPER_ADMIN'){toast('Refund trên ngưỡng cần Super Admin kiểm duyệt trong demo',true);return}if(!confirm('Phê duyệt HOÀN TIỀN DEMO '+money(obj.amount)+'?'))return;{const t=find('tasks',obj.taskId),p=db.payments.find(p=>p.taskId===obj.taskId);if(!p||!['HELD','RELEASED','PARTIALLY_REFUNDED'].includes(p.status)){toast('Giao dịch không đủ điều kiện hoàn tiền',true);return}const already=sum(db.refunds.filter(r=>r.taskId===obj.taskId&&r.status==='APPROVED'),r=>r.amount);if(already+obj.amount>p.amount){toast('Vượt quá tổng tiền thanh toán',true);return}obj.status='APPROVED';if(already+obj.amount>=p.amount){p.status='REFUNDED';if(t){t.payment='REFUNDED';updateTask(t,'REFUNDED','Approved full refund demo')}}else{p.status='PARTIALLY_REFUNDED';if(t)t.payment='PARTIALLY_REFUNDED'}recordLedger('REFUND',obj.taskId,-obj.amount,'Escrow/Provider demo','Customer',obj.status);log('REFUND_APPROVE','refunds',id,money(obj.amount));}break;
 case 'rejectRefund':if(!obj||obj.status!=='PENDING')return;obj.status='REJECTED';log('REFUND_REJECT','refunds',id);break;
 case 'approvePayout':if(!obj||obj.status!=='PENDING')return;obj.status='APPROVED';log('PAYOUT_APPROVE','payouts',id,money(obj.amount));break;
 case 'completePayout':if(!obj||obj.status!=='APPROVED'){toast('Chỉ yêu cầu đã duyệt mới được đánh dấu hoàn tất',true);return}obj.status='COMPLETED';recordLedger('PAYOUT','',-obj.amount,'Platform demo','Partner '+obj.partnerId,'COMPLETED');log('PAYOUT_SETTLED','payouts',id,money(obj.amount));break;
 case 'rejectPayout':if(!obj||obj.status!=='PENDING')return;obj.status='REJECTED';log('PAYOUT_REJECT','payouts',id);break;
 case 'reviewDispute':if(!obj||obj.status==='RESOLVED')return;obj.status='REVIEW';log('DISPUTE_REVIEW','disputes',id);break;
 case 'resolveDisputeRefund':if(!obj||obj.status==='RESOLVED')return;{const t=find('tasks',obj.taskId);if(!ensureTaskForRefund(t))return;const p=db.payments.find(p=>p.taskId===obj.taskId);db.refunds.unshift({id:uid('RF'),paymentId:p?.id,taskId:obj.taskId,amount:Math.min(obj.amount,p?.amount||obj.amount),reason:'Dispute '+obj.id,status:'PENDING',created:today()});obj.status='REVIEW';log('DISPUTE_REFUND_REQUEST','disputes',id,'Awaiting Finance approval');toast('Đã tạo yêu cầu hoàn tiền, cần Finance xử lý');}
 break;
 case 'resolveDisputeRelease':if(!obj||obj.status==='RESOLVED')return;{const t=find('tasks',obj.taskId);if(!t||!release(t,'Dispute: release by '+db.actor))return;obj.status='RESOLVED';obj.decision='RELEASE';log('DISPUTE_RELEASE','disputes',id);}break;
 case 'closeDispute':if(!obj||obj.status==='RESOLVED')return;obj.status='RESOLVED';obj.decision='NO_REFUND';{const t=find('tasks',obj.taskId);if(t&&t.status==='DISPUTED')updateTask(t,'COMPLETED','Dispute closed, awaiting confirmation')}log('DISPUTE_CLOSE','disputes',id);break;
 case 'assignTicket':if(!obj)return;obj.agent='Support '+db.actor;obj.status='IN_PROGRESS';log('TICKET_ASSIGN','tickets',id,obj.agent);break;

 case 'resolveTicket':if(!obj)return;obj.status='RESOLVED';log('TICKET_RESOLVE','tickets',id);break;

 case 'sendCampaign':if(!obj||obj.status==='SENT')return;obj.status='SENT';obj.sent=obj.audience==='Partners'?db.partners.length:obj.audience==='Customers'?db.customers.length:db.customers.length+db.partners.length;log('CAMPAIGN_DEMO_SEND','campaigns',id,obj.audience);toast('Đã ghi nhận chiến dịch gửi giả lập');break;
 case 'reviewReport':obj.status='IN_REVIEW';log('REPORT_REVIEW','reports',id);break;

 case 'customerTasks':navigate('tasks');globalQ=id;$('#globalSearch').value=id;renderContent();return;
 case 'partnerTasks':navigate('tasks');globalQ=id;$('#globalSearch').value=id;renderContent();return;
 case 'partnerKyc':{const k=db.kycs.find(k=>k.partnerId===id);if(k)detail('kycs',k.id);return}
 default:toast('Thao tác chưa được hỗ trợ',true);return;
 }
 save();$('#layer').innerHTML='';toast('Đã cập nhật '+id+' (demo)');renderContent();
}
function simTask(){if(!guard('tasks'))return;const s=db.services.find(s=>s.active),c=db.customers[0];const t={id:uid('TL'),customerId:c.id,partnerId:'',serviceId:s?.id||'clean',date:'2026-10-16',time:'10:00',location:'Thủ Đức',total:260000,status:'MATCHING',payment:'HELD',description:'Đơn demo từ Live Operations',history:[{status:'POSTED',actor:'Customer demo',at:dt()},{status:'MATCHING',actor:'System demo',at:dt()}]};db.tasks.unshift(t);db.payments.unshift({id:uid('PM'),taskId:t.id,customerId:c.id,amount:t.total,status:'HELD',method:'Sandbox demo',created:today(),providerRef:uid('SIM')});recordLedger('HOLD',t.id,t.total,'Customer','Escrow demo','HELD');log('SIMULATE_NEW_TASK','tasks',t.id);toast('Đã tạo Task '+t.id+' và thanh toán HELD demo');renderContent()}
function autoMatch(){if(!guard('matching'))return;const t=db.tasks.find(t=>t.status==='MATCHING');if(!t){toast('Không có Task chờ Matching',true);return}const eligible=db.partners.filter(p=>p.status==='ACTIVE'&&p.online&&p.kyc==='APPROVED'&&p.skills.includes(t.serviceId)&&!db.tasks.some(j=>j.id!==t.id&&j.partnerId===p.id&&j.date===t.date&&j.time===t.time&&['ACCEPTED','TASKER_ON_THE_WAY','ARRIVED','IN_PROGRESS'].includes(j.status)));const p=eligible.find(p=>p.area===t.location)||eligible[0];if(!p){toast('Không tìm thấy Partner đủ điều kiện',true);return}t.partnerId=p.id;updateTask(t,'ACCEPTED','Auto matching simulation');log('AUTO_MATCH','tasks',t.id,p.id);toast('Đã gán '+p.name+' cho '+t.id);renderContent()}

function download(content,name,mime){const blob=new Blob([content],{type:mime});const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1200)}
function csv(type){const rows=db[type]||[];if(!rows.length){toast('Không có dữ liệu',true);return}const keys=unique(rows.flatMap(o=>Object.keys(o)));const encode=s=>'"'+String(s??'').replace(/"/g,'""')+'"';const lines=[keys.map(encode).join(','),...rows.map(o=>keys.map(k=>encode(typeof o[k]==='object'?JSON.stringify(o[k]):o[k])).join(','))];download('\ufeff'+lines.join('\r\n'),'TASKLY_'+type.toUpperCase()+'_'+today()+'.csv','text/csv;charset=utf-8');toast('Đã xuất CSV '+type)}

 if(!Array.isArray(mobile.tasks)){toast('JSON cần có mảng tasks của Mobile V3 hoặc Admin snapshot',true);return}
 if(!confirm('Nhập thêm Task từ snapshot Mobile V3? File demo có thể khác cấu trúc; dữ liệu trùng ID sẽ được bỏ qua.'))return;
 let count=0;for(const t of mobile.tasks){if(!t.id||db.tasks.some(x=>x.id===t.id))continue;const sid=t.service||t.serviceId||'clean';const cust=db.customers.find(c=>c.name===t.createdBy)||db.customers[0];const part=db.partners.find(p=>p.name===t.assigned||p.id===t.partnerId);let rec={id:String(t.id),customerId:cust.id,partnerId:part?.id||'',serviceId:db.services.some(s=>s.id===sid)?sid:'clean',date:t.date||today(),time:t.time||'08:00',location:t.address||t.location||'Chưa có',total:Number(t.total)||0,status:STATUS[t.status]?t.status:'POSTED',payment:t.payment||'PENDING',description:t.description||'',history:(Array.isArray(t.history)?t.history:[]).map(h=>({status:h.status||'POSTED',actor:h.actor||'Mobile import',at:h.at||dt()}))};db.tasks.unshift(rec);if(!db.payments.some(p=>p.taskId===rec.id))db.payments.unshift({id:uid('PM'),taskId:rec.id,customerId:rec.customerId,amount:rec.total,status:rec.payment,method:'Mobile import demo',created:today(),providerRef:'IMPORTED'});count++}
 log('IMPORT_MOBILE','datalab','JSON',count+' tasks from '+file.name);toast('Đã nhập '+count+' task, bỏ qua dữ liệu trùng ID');navigate('tasks')}
function confirmReset(){if(!confirm('Reset toàn bộ dữ liệu Admin demo về bản mẫu? Không thể hoàn tác nếu chưa export backup.'))return;db=seed();save();toast('Đã reset toàn bộ dữ liệu demo');navigate('dashboard')}
function switchRole(newRole){if(!ROLES.includes(newRole))return;db.actor=newRole;$('#roleSelect').value=newRole;save();renderContent();toast('Chế độ thử nghiệm: '+newRole)}
function doAction(action,id){if(action==='close'){$('#layer').innerHTML='';return}if(action==='detail'){const [type,...rest]=id.split(':');detail(type,rest.join(':'));return}if(action==='goto'){navigate(id);return}if(action==='csv'){csv(id);return}if(action==='form'){const [type,...rest]=id.split(':');openForm(type,rest.join(':'));return}if(action==='simulateTask'){simTask();return}if(action==='autoMatch'){autoMatch();return}if(action==='adjustPoints'){adjustPoints(id);return}if(action==='reset'){confirmReset();return}if(action==='exportAdmin'){download(JSON.stringify(db,null,2),'TASKLY_ADMIN_SNAPSHOT_'+today()+'.json','application/json');toast('Đã export bản sao JSON');return}if(action==='importHelp'){toast('Vào Mobile V3 → Diagnostics → Export JSON Snapshot; chọn file trong mục Data Lab.');return}if(action==='role'){switchRole(id);return}if(action==='range'){toast('Biểu đồ hiện dùng dữ liệu mô phỏng 12 kỳ, chưa có bộ lọc ngày thật.');return}if(action==='flag'){if(!guard('settings'))return;db.settings[id]=!db.settings[id];log('FEATURE_FLAG','settings',id,String(db.settings[id]));renderContent();toast('Đã chuyển '+id);return}
 const idx=id.indexOf(':'),type=idx<0?'':id.slice(0,idx),key=idx<0?'':id.slice(idx+1);mutate(action,type,key)
}
document.addEventListener('click',e=>{const g=e.target.closest('[data-goto]');if(g){navigate(g.dataset.goto);return}const a=e.target.closest('[data-action]');if(a){doAction(a.dataset.action,a.dataset.id||'');return}if(e.target.id==='dismiss'){$('#layer').innerHTML=''}});
document.addEventListener('submit',e=>{if(e.target.id==='recordForm'){e.preventDefault();saveForm(e.target)}if(e.target.id==='quickForm'){e.preventDefault();const submit=window._modalSubmit;const vals=Object.fromEntries(new FormData(e.target).entries());$('#layer').innerHTML='';if(submit)submit(vals)}if(e.target.id==='settingsForm'){e.preventDefault();if(!guard('settings'))return;const o=Object.fromEntries(new FormData(e.target).entries());for(const k in o)db.settings[k]=['platformFee','otpTTL','matchRadius','travelBuffer','autoReleaseHours','refundThreshold'].includes(k)?Number(o[k]):o[k];log('SETTINGS_UPDATE','settings','GLOBAL',JSON.stringify(o));toast('Đã lưu cấu hình demo');renderContent()}});
document.addEventListener('change',e=>{if(e.target.id==='filterStatus'){listFilter=e.target.value;renderContent()}if(e.target.id==='roleSelect')switchRole(e.target.value);if(e.target.id==='importFile')importFile(e.target.files[0])});
document.addEventListener('input',e=>{if(e.target.id==='globalSearch'){globalQ=e.target.value;renderContent()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#layer').innerHTML='';$('.sidebar').classList.remove('show')}});
function start(){drawNav();$('#roleSelect').value=db.actor;renderContent();$('#mobileMenu').addEventListener('click',()=>$('.sidebar').classList.toggle('show'));$('#toast').hidden=true;save()}
start();
</script></body></html>
